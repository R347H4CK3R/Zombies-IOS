name: Tranzit Design Branch Tests

on:
  push:
    branches:
      - design/tranzit-runtime-asset-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run redistribution and render-gate Python tests
        run: python3 -m unittest Tools.tests.test_content_audit Tools.tests.test_render_gate -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run ZombiesIOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for _, devices in data.get("devices", {}).items():
              for d in reversed(devices):
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["name"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          ')"
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOSTests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            test
