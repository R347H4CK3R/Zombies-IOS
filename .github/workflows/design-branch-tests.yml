name: Tranzit Design Branch Tests

on:
  push:
    branches:
      - design/tranzit-runtime-asset-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run redistribution and render-gate Python tests
        run: python3 -m unittest Tools.tests.test_content_audit Tools.tests.test_render_gate -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_JSON="$(xcrun simctl list devices available -j)"
          DEVICE_NAME="$(printf '%s' "$DEVICE_JSON" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for _, devices in data.get("devices", {}).items():
              for d in reversed(devices):
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["name"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          ')"
          DEVICE_UDID="$(printf '%s' "$DEVICE_JSON" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for _, devices in data.get("devices", {}).items():
              for d in reversed(devices):
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          ')"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

      - name: Run ZombiesIOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOSTests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build simulator app for render gate
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/RenderGateDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch synthetic Tranzit renderer and validate screenshot
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          DEVICE_UDID='${{ steps.simulator.outputs.udid }}'
          APP_PATH="$(find build/RenderGateDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" --tranzit-render-test

          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE_UDID" "$BUNDLE_ID" data)"
          METRICS="$DATA_CONTAINER/Documents/render-metrics.json"
          for _ in {1..30}; do
            if [ -s "$METRICS" ] && python3 - "$METRICS" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          raise SystemExit(0 if m.get('blackPixelRatio', 1.0) < 1.0 else 1)
          PY
            then
              break
            fi
            sleep 1
          done

          test -s "$METRICS"
          mkdir -p build/render-gate
          xcrun simctl io "$DEVICE_UDID" screenshot build/render-gate/synthetic-tranzit.png
          cp "$METRICS" build/render-gate/render-metrics.json
          cat build/render-gate/render-metrics.json
          python3 Tools/render_gate.py build/render-gate/synthetic-tranzit.png build/render-gate/render-metrics.json
          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE_UDID" || true
