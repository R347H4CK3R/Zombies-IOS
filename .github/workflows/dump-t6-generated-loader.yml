name: Dump T6 Generated Loader

on:
  push:
    branches: [bo2-full-conversion]
    paths:
      - '.github/workflows/dump-t6-generated-loader.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install x86 build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libc6-dev-i386
      - name: Clone OpenAssetTools
        run: git clone --depth 1 --recurse-submodules https://github.com/Laupetin/OpenAssetTools.git oat
      - name: Generate T6 zone loader source
        working-directory: oat
        env:
          PREMAKE_NO_PROMPT: '1'
        run: |
          set -euxo pipefail
          chmod +x generate.sh
          ./generate.sh
          make -C build -j2 config=release_x86 ZoneCode
          find build -type f \( -iname '*gfxworld*load*.cpp' -o -iname '*gfxworld*load*.h' \) -print | tee ../gfxworld-files.txt
          mkdir -p ../generated
          while IFS= read -r f; do cp --parents "$f" ../generated/; done < ../gfxworld-files.txt
          test -s ../gfxworld-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: t6-generated-gfxworld-loader
          path: |
            gfxworld-files.txt
            generated/
          if-no-files-found: error
          retention-days: 1

# Refresh this artifact whenever the T6 loader reference needs re-verification.
