name: Dump T6 Generated Loader

on:
  push:
    branches: [bo2-full-conversion]
    paths:
      - '.github/workflows/dump-t6-generated-loader.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install x86 build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libc6-dev-i386
      - name: Clone OpenAssetTools
        run: git clone --depth 1 --recurse-submodules https://github.com/Laupetin/OpenAssetTools.git oat
      - name: Generate T6 zone loader source
        working-directory: oat
        env:
          PREMAKE_NO_PROMPT: '1'
        run: |
          set -euxo pipefail
          chmod +x generate.sh
          ./generate.sh
          make -C build -j2 config=release_x86 ZoneCode
          T6_ROOT="build/src/ZoneCode/Game/T6/XAssets"
          test -d "$T6_ROOT"
          find "$T6_ROOT" -type f \( -name '*_load_db.cpp' -o -name '*_load_db.h' \) -print | sort | tee ../t6-loader-files.txt
          test -s ../t6-loader-files.txt
          mkdir -p ../generated
          while IFS= read -r f; do cp --parents "$f" ../generated/; done < ../t6-loader-files.txt
          grep -R -n -E 'Load_GfxLight|Loader_GfxLightDef|Loader_GfxImage|Load_GfxWorld' "$T6_ROOT" > ../t6-loader-symbols.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: t6-generated-loaders
          path: |
            t6-loader-files.txt
            t6-loader-symbols.txt
            generated/
          if-no-files-found: error
          retention-days: 1
