name: Dump T6 Generated Loader

on:
  push:
    branches: [bo2-full-conversion]
    paths:
      - '.github/workflows/dump-t6-generated-loader.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Clone OpenAssetTools
        run: git clone --depth 1 --recurse-submodules https://github.com/Laupetin/OpenAssetTools.git oat
      - name: Generate project and zone code
        working-directory: oat
        env:
          PREMAKE_NO_PROMPT: '1'
        run: |
          chmod +x generate.sh
          ./generate.sh
          find . -type f \( -iname '*gfxworld*load*.cpp' -o -iname '*gfxworld*load*.h' \) -print | tee ../gfxworld-files.txt
          mkdir -p ../generated
          while IFS= read -r f; do cp --parents "$f" ../generated/; done < ../gfxworld-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: t6-generated-gfxworld-loader
          path: |
            gfxworld-files.txt
            generated/
          if-no-files-found: error
          retention-days: 1
