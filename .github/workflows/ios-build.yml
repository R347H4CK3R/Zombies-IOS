# Manual build only. Source commits do not automatically build an IPA.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate BO2 asset boundary
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print -quit | grep -q .; then
            echo "::error::Raw BO2/PS3 payload files must stay local and must not be bundled into the repository IPA."
            find . -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print
            exit 1
          fi

          grep -q 'TranzitRuntimeIndex' Sources/ZombiesIOS/ContentView.swift || {
            echo "::error::Importer is not wired into the Tranzit runtime index."
            exit 1
          }

          test -f Sources/ZombiesIOS/Services/DirectFolderImporter.swift || {
            echo "::error::Direct folder importer is missing."
            exit 1
          }

          test -f Sources/ZombiesIOS/Models/TranzitRuntimeIndex.swift || {
            echo "::error::Tranzit runtime index model is missing."
            exit 1
          }

          test -f Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift || {
            echo "::error::T6 GfxSurface fallback reconstructor is missing."
            exit 1
          }

          test -f Sources/ZombiesIOS/Services/T6MeshPreviewExtractor.swift || {
            echo "::error::T6 raw vertex/index mesh decoder is missing."
            exit 1
          }

      - name: Wire real Tranzit mesh before bounds fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift')
          text = path.read_text()

          old_budget = 'let decodeBudget = isMainTranzit ? 64 * 1024 * 1024 : 32 * 1024 * 1024'
          new_budget = 'let decodeBudget = isMainTranzit ? 128 * 1024 * 1024 : 48 * 1024 * 1024'
          if old_budget in text:
              text = text.replace(old_budget, new_budget, 1)
          elif new_budget not in text:
              raise SystemExit('Could not locate Tranzit decode budget')

          old_mesh = '''let mesh = T6GfxSurfaceMeshExtractor.extract(from: payload, scanLimit: payload.count)
                        ?? T6MeshPreviewExtractor.extract(from: payload, scanLimit: payload.count)'''
          new_mesh = '''let mesh = T6MeshPreviewExtractor.extract(
                        from: payload,
                        scanLimit: payload.count
                    ) ?? T6GfxSurfaceMeshExtractor.extract(
                        from: payload,
                        scanLimit: payload.count
                    )'''
          if old_mesh in text:
              text = text.replace(old_mesh, new_mesh, 1)
          elif new_mesh not in text:
              raise SystemExit('Could not locate runtime mesh extraction call')

          old_status = 'runtimeStatus = isMainTranzit ? "TRANZIT GFXSURFACE SEARCH" : "T6 WORLD MESH SEARCH"'
          new_status = 'runtimeStatus = isMainTranzit ? "TRANZIT REAL MESH SEARCH" : "T6 REAL MESH SEARCH"'
          if old_status in text:
              text = text.replace(old_status, new_status, 1)

          path.write_text(text)
          PY

          grep -q 'T6MeshPreviewExtractor.extract' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'T6GfxSurfaceMeshExtractor.extract' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q '128 \* 1024 \* 1024' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'TRANZIT REAL MESH SEARCH' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa \
              --target "$GITHUB_SHA" \
              --title "Latest ZombiesIOS IPA" \
              --notes "Unsigned iOS build prioritizing decoded BO2 Tranzit vertex/index geometry before GfxSurface bounds fallback. Sign before installing on iPhone."
          fi
