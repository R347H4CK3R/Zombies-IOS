name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/bo2-quake-runtime-primary ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

concurrency:
  group: zombies-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Test BO2 Quake contracts
        run: |
          python3 -m unittest Tools.tests.test_bo2_quake_primary_runtime -v
          python3 -m unittest Tools.tests.test_t6_gfxsurface_layout -v
          python3 -m unittest Tools.tests.test_content_audit -v

      - name: Test native Quake runtime
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror Engine/Quake3/zq3_runtime.c Engine/Quake3/tests/zq3_runtime_smoke.c -lm -o /tmp/zq3-runtime-smoke
          /tmp/zq3-runtime-smoke

      - name: Prepare CI visual test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pillow

      - name: Test CI visual validator
        run: .venv/bin/python -m unittest Tools.tests.test_ci_visual_validate -v

      - name: Audit source tree for non-redistributable content
        run: python3 Tools/content_audit.py . --allowlist Tools/content_allowlist.txt

      - name: Validate Quake production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f Engine/Quake3/zq3_runtime.c
          test -f Engine/Quake3/zq3_runtime.h
          test -f Sources/ZombiesIOS/EngineBridge/QuakeRuntimeController.swift
          test -f Sources/ZombiesIOS/Views/QuakeGameplayView.swift
          test -f Sources/ZombiesIOS/Views/BO2QuakeRootView.swift
          test -f Sources/ZombiesIOS/Services/BO2MapRuntimeLoader.swift
          test -f Sources/ZombiesIOS/Services/BO2RuntimePackage/BO2RuntimePackage.swift
          grep -Fq 'BO2QuakeRootView()' Sources/ZombiesIOS/ZombiesIOSApp.swift
          grep -Fq 'QuakeGameplayView(package:' Sources/ZombiesIOS/Views/BO2QuakeRootView.swift
          grep -Fq 'T6PS3PayloadDecoder' Sources/ZombiesIOS/Services/BO2MapRuntimeLoader.swift
          grep -Fq 'T6GfxSurfaceMeshExtractor' Sources/ZombiesIOS/Services/BO2MapRuntimeLoader.swift
          grep -Fq 'mp_hijacked.ff' Sources/ZombiesIOS/Models/BO2ZombiesManifest.swift
          if grep -Fq 'NativeFPSSceneView(' Sources/ZombiesIOS/Views/CIGameplayValidationEntryView.swift; then exit 1; fi
          if grep -Fq 'import SceneKit' Sources/ZombiesIOS/Views/CIGameplayValidationEntryView.swift; then exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/SimulatorDerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Boot fresh iPhone 17 Simulator and validate Quake rendering
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/ci-gameplay

          python3 - <<'PY' > build/ci-gameplay/simulator-selection.txt
          import json, subprocess
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          matches=[d for d in types if d.get('name')=='iPhone 17']
          if not matches: raise SystemExit('Required iPhone 17 device type is not installed')
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          ios=[r for r in runtimes if r.get('isAvailable') and (r.get('platform')=='iOS' or 'iOS' in r.get('name',''))]
          if not ios: raise SystemExit('No available iOS Simulator runtime found')
          def key(r):
              return tuple(int(p) if p.isdigit() else 0 for p in r.get('version','0').split('.'))
          runtime=sorted(ios,key=key,reverse=True)[0]
          print(matches[0]['identifier']); print(runtime['identifier']); print(runtime.get('name',runtime['identifier']))
          PY

          DEVICE_TYPE="$(sed -n '1p' build/ci-gameplay/simulator-selection.txt)"
          DEVICE_RUNTIME_ID="$(sed -n '2p' build/ci-gameplay/simulator-selection.txt)"
          DEVICE_RUNTIME_NAME="$(sed -n '3p' build/ci-gameplay/simulator-selection.txt)"
          DEVICE_NAME="ZombiesIOS-Quake-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DEVICE_UDID="$(xcrun simctl create "$DEVICE_NAME" "$DEVICE_TYPE" "$DEVICE_RUNTIME_ID")"
          cleanup() {
            xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$DEVICE_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$DEVICE_UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf 'name=%s\nudid=%s\nruntime=%s\n' "$DEVICE_NAME" "$DEVICE_UDID" "$DEVICE_RUNTIME_NAME" > build/ci-gameplay/simulator-metadata.txt

          boot() {
            xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
            DEVICE_UDID="$DEVICE_UDID" python3 - <<'PY'
          import os, subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['DEVICE_UDID'],'-b'],check=True,timeout=180)
          PY
          }
          if ! boot; then
            xcrun simctl shutdown "$DEVICE_UDID" >/dev/null 2>&1 || true
            xcrun simctl erase "$DEVICE_UDID"
            boot
          fi

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" --ci-gameplay-validation | tee build/ci-gameplay/launch-output.txt
          sleep 4
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-1.png
          sleep 2
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-2.png
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE_UDID" "$BUNDLE_ID" data)"
          cp "$DATA_CONTAINER/Documents/ci-render-diagnostics.json" build/ci-gameplay/ci-render-diagnostics.json
          .venv/bin/python Tools/ci_visual_validate.py --screenshot-1 build/ci-gameplay/gameplay-1.png --screenshot-2 build/ci-gameplay/gameplay-2.png --diagnostics build/ci-gameplay/ci-render-diagnostics.json --report build/ci-gameplay/visual-report.json

      - name: Upload CI Quake validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-quake-ci-validation-evidence
          path: build/ci-gameplay
          if-no-files-found: warn
          retention-days: 30

      - name: Build unsigned device app
        run: xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Audit built app for non-redistributable content
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          python3 Tools/content_audit.py "$APP_PATH" --allowlist Tools/content_allowlist.txt

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload; mkdir Payload; cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa --target "$GITHUB_SHA" --title "Latest ZombiesIOS IPA" --notes "Unsigned native BO2 Quake iOS runtime build. Retail BO2 assets are user-supplied and are not bundled."
          fi
