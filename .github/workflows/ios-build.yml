# Native Quake/BO2 iOS build and gameplay validation.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, ci-gameplay-validation-final, feature/bo2-quake3-ios-runtime ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

concurrency:
  group: zombies-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run source and native runtime tests
        run: python3 -m unittest discover -s Tools/tests -v

      - name: Prepare CI visual test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pillow

      - name: Test CI visual validator
        run: .venv/bin/python -m unittest Tools.tests.test_ci_visual_validate -v

      - name: Audit source tree for non-redistributable content
        run: python3 Tools/content_audit.py . --allowlist Tools/content_allowlist.txt

      - name: Validate Quake runtime source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f Engine/Quake3/zq3_runtime.c
          test -f Engine/Quake3/zq3_runtime.h
          test -f Engine/Quake3/COPYING.txt
          test -f Sources/ZombiesIOS/Services/BO2RuntimePackage/BO2RuntimePackage.swift
          test -f Sources/ZombiesIOS/Services/BO2RuntimePackage/BO2RuntimePackageWriter.swift
          test -f Sources/ZombiesIOS/Services/BO2RuntimePackage/BO2EntityParser.swift
          test -f Sources/ZombiesIOS/Services/BO2MapRuntimeLoader.swift
          test -f Sources/ZombiesIOS/EngineBridge/QuakeRuntimeController.swift
          test -f Sources/ZombiesIOS/Views/QuakeGameplayView.swift
          test -f Sources/ZombiesIOS/Views/HijackedTouchGameplayView.swift
          test -f Sources/ZombiesIOS/Support/CIRuntimeMeshFixture.swift
          test -f Sources/ZombiesIOS/Support/CIRenderDiagnostics.swift
          test -f Sources/ZombiesIOS/Views/CIGameplayValidationEntryView.swift
          grep -Fq -- '--ci-gameplay-validation' Sources/ZombiesIOS/Support/CIValidationMode.swift
          grep -Fq 'ZOMBIESIOS_CI_GAMEPLAY' Sources/ZombiesIOS/Support/CIValidationMode.swift
          grep -Fq 'QuakeGameplayView' Sources/ZombiesIOS/Views/CIGameplayValidationEntryView.swift
          grep -Fq 'MTKView' Sources/ZombiesIOS/Views/QuakeGameplayView.swift
          grep -Fq 'zq3_load_world' Engine/Quake3/zq3_runtime.c
          grep -Fq 'mp_hijacked.ff' Sources/ZombiesIOS/Models/BO2MapTarget.swift
          grep -Fq 'mp_hijacked.ipak' Sources/ZombiesIOS/Models/BO2MapTarget.swift
          grep -Fq 'mpl_hijacked.all.sabs' Sources/ZombiesIOS/Models/BO2MapTarget.swift
          if grep -Fq 'NativeFPSSceneView' Sources/ZombiesIOS/Views/CIGameplayValidationEntryView.swift; then exit 1; fi

      - name: Validate T6 extraction path
        shell: bash
        run: |
          set -euo pipefail
          EXTRACTOR='Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift'
          LOADER='Sources/ZombiesIOS/Services/BO2MapRuntimeLoader.swift'
          grep -Fq 'firstVertex = Int(Int32(bitPattern: be32(bytes, offset + 0x20)))' "$EXTRACTOR"
          grep -Fq 'vertexCount = Int(be16(bytes, offset + 0x28))' "$EXTRACTOR"
          grep -Fq 'triCount = Int(be16(bytes, offset + 0x2A))' "$EXTRACTOR"
          grep -Fq 'baseIndex = Int(Int32(bitPattern: be32(bytes, offset + 0x2C)))' "$EXTRACTOR"
          grep -Fq 'T6PS3PayloadDecoder' "$LOADER"
          grep -Fq 'T6GfxSurfaceMeshExtractor.extract' "$LOADER"
          if grep -Fq 'T6GfxBoundsFallbackExtractor' "$LOADER"; then exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/SimulatorDerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Boot iPhone 17 Simulator and validate Quake rendering
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/ci-gameplay

          python3 - <<'PY' > build/ci-gameplay/selected-device.txt
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          matches=[]
          all_iphones=[]
          for runtime, devices in data.get('devices', {}).items():
              for d in devices:
                  if not d.get('isAvailable'):
                      continue
                  name=d.get('name','')
                  if name.startswith('iPhone'):
                      all_iphones.append((runtime,name,d['udid']))
                      if name == 'iPhone 17':
                          matches.append((runtime,name,d['udid']))
          if not matches:
              print('Available iPhone simulators:', file=__import__('sys').stderr)
              for runtime,name,udid in all_iphones:
                  print(f'  {name} | {runtime} | {udid}', file=__import__('sys').stderr)
              raise SystemExit('Required iPhone 17 Simulator is not installed on this runner')
          runtime,name,udid=sorted(matches, reverse=True)[0]
          print(udid); print(name); print(runtime)
          PY

          DEVICE_UDID="$(sed -n '1p' build/ci-gameplay/selected-device.txt)"
          DEVICE_NAME="$(sed -n '2p' build/ci-gameplay/selected-device.txt)"
          DEVICE_RUNTIME="$(sed -n '3p' build/ci-gameplay/selected-device.txt)"
          test "$DEVICE_NAME" = "iPhone 17"
          printf 'name=%s\nudid=%s\nruntime=%s\n' "$DEVICE_NAME" "$DEVICE_UDID" "$DEVICE_RUNTIME" > build/ci-gameplay/simulator-metadata.txt

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          DEVICE_UDID="$DEVICE_UDID" python3 - <<'PY'
          import os, subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['DEVICE_UDID'],'-b'], check=True, timeout=240)
          PY
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" --ci-gameplay-validation 2>&1)"
          echo "$LAUNCH_OUTPUT" | tee build/ci-gameplay/launch-output.txt
          echo "$LAUNCH_OUTPUT" | grep -Eq "$BUNDLE_ID: [0-9]+"

          sleep 4
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-1.png
          sleep 2
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-2.png
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE_UDID" "$BUNDLE_ID" data)"
          test -f "$DATA_CONTAINER/Documents/ci-render-diagnostics.json"
          cp "$DATA_CONTAINER/Documents/ci-render-diagnostics.json" build/ci-gameplay/ci-render-diagnostics.json

          .venv/bin/python Tools/ci_visual_validate.py --screenshot-1 build/ci-gameplay/gameplay-1.png --screenshot-2 build/ci-gameplay/gameplay-2.png --diagnostics build/ci-gameplay/ci-render-diagnostics.json --report build/ci-gameplay/visual-report.json

          DEVICE_UDID="$DEVICE_UDID" python3 - <<'PY' > build/ci-gameplay/simulator.log 2>&1 || true
          import os, subprocess
          try:
              p=subprocess.run(['xcrun','simctl','spawn',os.environ['DEVICE_UDID'],'log','show','--style','compact','--last','30s','--predicate','process == "ZombiesIOS"'], text=True, capture_output=True, timeout=20)
              print(p.stdout[-200000:]); print(p.stderr[-20000:])
          except Exception as e:
              print('log capture failed:', e)
          PY
          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Upload CI gameplay validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-ci-validation-evidence
          path: build/ci-gameplay
          if-no-files-found: warn
          retention-days: 30

      - name: Build unsigned device app
        run: xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify compiled native runtime
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$APP_PATH/ZombiesIOS"; test -f "$EXECUTABLE"
          STRINGS_FILE="$(mktemp)"; trap 'rm -f "$STRINGS_FILE"' EXIT
          strings "$EXECUTABLE" > "$STRINGS_FILE"
          grep -Fq 'CI QUAKE RUNTIME' "$STRINGS_FILE"
          grep -Fq 'HIJACKED' "$STRINGS_FILE"
          nm "$EXECUTABLE" | grep -Eq '_?zq3_init'
          nm "$EXECUTABLE" | grep -Eq '_?zq3_load_world'

      - name: Audit built app for non-redistributable content
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          python3 Tools/content_audit.py "$APP_PATH" --allowlist Tools/content_allowlist.txt

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload; mkdir Payload; cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa --target "$GITHUB_SHA" --title "Latest ZombiesIOS IPA" --notes "Unsigned native iOS build with Quake III-derived runtime. User-owned BO2 assets are loaded separately and are not bundled. Sign before installing on iPhone."
          fi
