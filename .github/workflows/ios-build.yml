# Manual build only. Source commits do not automatically build an IPA.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate BO2 asset boundary
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print -quit | grep -q .; then
            echo "::error::Raw BO2/PS3 payload files must stay local and must not be bundled into the repository IPA."
            find . -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print
            exit 1
          fi

          grep -q 'TranzitRuntimeIndex' Sources/ZombiesIOS/ContentView.swift || {
            echo "::error::Importer is not wired into the Tranzit runtime index."
            exit 1
          }

          test -f Sources/ZombiesIOS/Services/DirectFolderImporter.swift || {
            echo "::error::Direct folder importer is missing."
            exit 1
          }

          test -f Sources/ZombiesIOS/Models/TranzitRuntimeIndex.swift || {
            echo "::error::Tranzit runtime index model is missing."
            exit 1
          }

          test -f Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift || {
            echo "::error::T6 GfxWorld geometry decoder is missing."
            exit 1
          }

      - name: Harden real Tranzit GfxWorld decode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gameplay = Path('Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift')
          text = gameplay.read_text()

          text, budget_n = re.subn(
              r'let decodeBudget = isMainTranzit \? \d+ \* 1024 \* 1024 : \d+ \* 1024 \* 1024',
              'let decodeBudget = isMainTranzit ? 128 * 1024 * 1024 : 48 * 1024 * 1024',
              text,
              count=1,
          )
          if budget_n != 1:
              raise SystemExit('Could not locate Tranzit decode budget')

          # Production rendering must use the validated GfxWorld path only.
          # The generic preview extractor can accept plausible random streams and
          # make another fake-looking scene, which masks a real decoder failure.
          old_mesh = '''let mesh = T6GfxSurfaceMeshExtractor.extract(from: payload, scanLimit: payload.count)
                        ?? T6MeshPreviewExtractor.extract(from: payload, scanLimit: payload.count)'''
          new_mesh = '''let mesh = T6GfxSurfaceMeshExtractor.extract(
                        from: payload,
                        scanLimit: payload.count
                    )'''
          if old_mesh in text:
              text = text.replace(old_mesh, new_mesh, 1)
          elif '?? T6MeshPreviewExtractor.extract' in text:
              raise SystemExit('Unexpected preview fallback layout')

          text = text.replace(
              'runtimeStatus = isMainTranzit ? "TRANZIT GFXSURFACE SEARCH" : "T6 WORLD MESH SEARCH"',
              'runtimeStatus = isMainTranzit ? "TRANZIT GFXWORLD DECODE" : "T6 GFXWORLD DECODE"',
              1,
          )

          # Do not let the name of zm_transit.ff beat an actually decoded mesh.
          text = text.replace(
              'if resource.fileName.lowercased() == "zm_transit.ff" { score += 50_000 }',
              'if resource.fileName.lowercased() == "zm_transit.ff", mesh != nil { score += 50_000 }',
              1,
          )

          gameplay.write_text(text)

          extractor = Path('Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift')
          etext = extractor.read_text()
          etext, scan_n = re.subn(
              r'private static let maxScanBytes = \d+ \* 1024 \* 1024',
              'private static let maxScanBytes = 128 * 1024 * 1024',
              etext,
              count=1,
          )
          if scan_n != 1:
              raise SystemExit('Could not locate GfxWorld scan cap')
          extractor.write_text(etext)

          # If real map reconstruction fails, do not draw the old tan debug arena
          # and make it look as if decoding succeeded.
          scene = Path('Sources/ZombiesIOS/Views/NativeFPSSceneView.swift')
          stext = scene.read_text()
          stext = stext.replace(
              '''            } else {
                buildSafetyFloor(visible: true)
                buildFallbackArena()
            }''',
              '''            } else {
                buildSafetyFloor(visible: true)
            }''',
              1,
          )
          scene.write_text(stext)
          PY

          grep -q '128 \* 1024 \* 1024' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'TRANZIT GFXWORLD DECODE' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'let mesh = T6GfxSurfaceMeshExtractor.extract' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          ! grep -q '?? T6MeshPreviewExtractor.extract' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'mesh != nil { score += 50_000 }' Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          grep -q 'private static let maxScanBytes = 128 \* 1024 \* 1024' Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift
          grep -q 'GFXWORLD:BE REAL' Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa \
              --target "$GITHUB_SHA" \
              --title "Latest ZombiesIOS IPA" \
              --notes "Unsigned iOS build using validated BO2 Tranzit GfxWorld geometry only; heuristic mesh and tan debug-arena fallbacks are disabled. Sign before installing on iPhone."
          fi
