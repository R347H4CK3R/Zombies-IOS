name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, ci-gameplay-validation-final, converted-tranzit-assets ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

concurrency:
  group: zombies-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run source tests
        run: |
          python3 -m unittest Tools.tests.test_content_audit -v
          python3 -m unittest Tools.tests.test_t6_gfxsurface_layout -v
          python3 -m unittest Tools.tests.test_converted_asset_architecture -v
          python3 -m unittest Tools.tests.test_converted_production_routing -v
          python3 -m unittest Tools.tests.test_converted_ci_route -v

      - name: Prepare CI visual test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pillow
          .venv/bin/python -m unittest Tools.tests.test_ci_visual_validate -v

      - name: Audit source tree for non-redistributable content
        run: python3 Tools/content_audit.py . --allowlist Tools/content_allowlist.txt

      - name: Validate converted production boundary
        shell: bash
        run: |
          set -euo pipefail
          GAMEPLAY='Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift'
          IMPORT='Sources/ZombiesIOS/ConvertedAssets/ConvertedTranzitImporter.swift'
          LOADER='Sources/ZombiesIOS/ConvertedAssets/ConvertedTranzitLoader.swift'
          SCENE='Sources/ZombiesIOS/Views/ConvertedTranzitSceneView.swift'
          ROUTE='Sources/ZombiesIOS/Views/ConvertedTranzitImportView.swift'
          PATHS='Sources/ZombiesIOS/ConvertedAssets/ConvertedTranzitPaths.swift'

          test -f "$IMPORT"; test -f "$LOADER"; test -f "$SCENE"; test -f "$ROUTE"
          grep -Fq 'ConvertedTranzitImporter' "$IMPORT"
          grep -Fq 'ConvertedTranzitLoader' "$LOADER"
          grep -Fq 'ConvertedTranzitSceneView' "$GAMEPLAY"
          grep -Fq 'ConvertedTranzit' "$PATHS"
          grep -Fq 'applicationSupportDirectory' "$PATHS"

          if grep -Fq 'T6PS3PayloadDecoder()' "$GAMEPLAY"; then exit 1; fi
          if grep -Fq 'T6GfxSurfaceMeshExtractor.extract' "$GAMEPLAY"; then exit 1; fi
          if grep -Fq 'TRANZIT GFXWORLD DECODE' "$GAMEPLAY"; then exit 1; fi
          if grep -Fq 'NativeFPSSceneView' "$GAMEPLAY"; then exit 1; fi
          if grep -Fq 'decodeT6Payload' "$GAMEPLAY"; then exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/SimulatorDerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Boot exact iPhone 17 and validate converted rendering
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/ci-gameplay

          python3 - <<'PY' > build/ci-gameplay/selected-device.txt
          import json, subprocess, sys
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          matches=[]; iphones=[]
          for runtime, devices in data.get('devices', {}).items():
              for d in devices:
                  if not d.get('isAvailable'): continue
                  name=d.get('name','')
                  if name.startswith('iPhone'):
                      iphones.append((runtime,name,d['udid']))
                      if name == 'iPhone 17': matches.append((runtime,name,d['udid']))
          if not matches:
              for runtime,name,udid in iphones: print(f'{name} | {runtime} | {udid}', file=sys.stderr)
              raise SystemExit('Required exact iPhone 17 Simulator is not installed')
          runtime,name,udid=sorted(matches, reverse=True)[0]
          print(udid); print(name); print(runtime)
          PY

          DEVICE_UDID="$(sed -n '1p' build/ci-gameplay/selected-device.txt)"
          DEVICE_NAME="$(sed -n '2p' build/ci-gameplay/selected-device.txt)"
          DEVICE_RUNTIME="$(sed -n '3p' build/ci-gameplay/selected-device.txt)"
          test "$DEVICE_NAME" = 'iPhone 17'
          printf 'name=%s\nudid=%s\nruntime=%s\n' "$DEVICE_NAME" "$DEVICE_UDID" "$DEVICE_RUNTIME" > build/ci-gameplay/simulator-metadata.txt

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          DEVICE_UDID="$DEVICE_UDID" python3 - <<'PY'
          import os, subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['DEVICE_UDID'],'-b'], check=True, timeout=240)
          PY
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" --ci-gameplay-validation 2>&1)"
          echo "$LAUNCH_OUTPUT" | tee build/ci-gameplay/launch-output.txt
          echo "$LAUNCH_OUTPUT" | grep -Eq "$BUNDLE_ID: [0-9]+"

          sleep 4
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-1.png
          sleep 2
          xcrun simctl io "$DEVICE_UDID" screenshot build/ci-gameplay/gameplay-2.png
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE_UDID" "$BUNDLE_ID" data)"
          test -f "$DATA_CONTAINER/Documents/ci-render-diagnostics.json"
          cp "$DATA_CONTAINER/Documents/ci-render-diagnostics.json" build/ci-gameplay/ci-render-diagnostics.json

          python3 - <<'PY'
          import json
          d=json.load(open('build/ci-gameplay/ci-render-diagnostics.json'))
          assert d['ready'] is True, d
          assert d['packageFormatVersion'] == 1, d
          assert d['packagePathClass'] == 'Application Support/ConvertedTranzit', d
          assert d['convertedTextureCount'] >= 1, d
          assert d['convertedWeaponVertexCount'] >= 3, d
          assert d['vertexCount'] >= 3 and d['triangleCount'] >= 1, d
          PY

          .venv/bin/python Tools/ci_visual_validate.py \
            --screenshot-1 build/ci-gameplay/gameplay-1.png \
            --screenshot-2 build/ci-gameplay/gameplay-2.png \
            --diagnostics build/ci-gameplay/ci-render-diagnostics.json \
            --report build/ci-gameplay/visual-report.json

          DEVICE_UDID="$DEVICE_UDID" python3 - <<'PY' > build/ci-gameplay/simulator.log 2>&1 || true
          import os, subprocess
          try:
              p=subprocess.run(['xcrun','simctl','spawn',os.environ['DEVICE_UDID'],'log','show','--style','compact','--last','30s','--predicate','process == "ZombiesIOS"'], text=True, capture_output=True, timeout=20)
              print(p.stdout[-200000:]); print(p.stderr[-20000:])
          except Exception as e: print('log capture failed:', e)
          PY
          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Upload converted gameplay validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-converted-validation-evidence
          path: build/ci-gameplay
          if-no-files-found: warn
          retention-days: 30

      - name: Build unsigned device app
        run: xcodebuild -project ZombiesIOS.xcodeproj -scheme ZombiesIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify compiled converted runtime path
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$APP_PATH/ZombiesIOS"; test -f "$EXECUTABLE"
          STRINGS_FILE="$(mktemp)"; trap 'rm -f "$STRINGS_FILE"' EXIT
          strings "$EXECUTABLE" > "$STRINGS_FILE"
          grep -Fq 'Converted Tranzit package' "$STRINGS_FILE"
          grep -Fq 'CONVERTED ASSET RUNTIME' "$STRINGS_FILE"

      - name: Audit built app for non-redistributable content
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          python3 Tools/content_audit.py "$APP_PATH" --allowlist Tools/content_allowlist.txt

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload; mkdir Payload; cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa --target "$GITHUB_SHA" --title "Latest ZombiesIOS IPA" --notes "Unsigned iOS build gated on converted-package rendering validation."
          fi
