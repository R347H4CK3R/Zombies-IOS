# Manual build only. Source commits do not automatically build an IPA.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test redistribution content audit
        run: python3 -m unittest Tools.tests.test_content_audit -v

      - name: Audit source tree for non-redistributable content
        run: python3 Tools/content_audit.py . --allowlist Tools/content_allowlist.txt

      - name: Validate runtime source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift
          test -f Sources/ZombiesIOS/Services/ExternalGameFolderStore.swift
          test -f Sources/ZombiesIOS/Services/RuntimeCachePolicy.swift
          test -f Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift
          test -f Sources/ZombiesIOS/Views/NativeFPSSceneView.swift

      - name: Validate strict Tranzit GfxWorld path
        shell: bash
        run: |
          set -euo pipefail
          GAMEPLAY='Sources/ZombiesIOS/Views/TranzitTouchGameplayView.swift'
          EXTRACTOR='Sources/ZombiesIOS/Services/T6GfxSurfaceMeshExtractor.swift'
          SCENE='Sources/ZombiesIOS/Views/NativeFPSSceneView.swift'

          grep -Fq '128 * 1024 * 1024' "$GAMEPLAY"
          grep -Fq 'TRANZIT GFXWORLD DECODE' "$GAMEPLAY"
          grep -Fq 'T6GfxSurfaceMeshExtractor.extract' "$GAMEPLAY"
          grep -Fq 'mesh != nil { score += 50_000 }' "$GAMEPLAY"

          if grep -Fq 'T6GfxBoundsFallbackExtractor.extract' "$GAMEPLAY"; then
            echo '::error::Synthetic GfxWorld bounds fallback is still wired into gameplay.'
            exit 1
          fi
          if grep -Fq 'T6MeshPreviewExtractor.extract' "$GAMEPLAY"; then
            echo '::error::Preview mesh fallback is still wired into gameplay.'
            exit 1
          fi
          if grep -Fq 'buildFallbackArena' "$SCENE"; then
            echo '::error::Synthetic fallback arena is still compiled into the scene.'
            exit 1
          fi

          grep -Fq 'firstVertex = Int(Int32(bitPattern: be32(bytes, offset + 0x1C)))' "$EXTRACTOR"
          grep -Fq 'vertexCount = Int(be16(bytes, offset + 0x20))' "$EXTRACTOR"
          grep -Fq 'triCount = Int(be16(bytes, offset + 0x22))' "$EXTRACTOR"
          grep -Fq 'baseIndex = Int(Int32(bitPattern: be32(bytes, offset + 0x24)))' "$EXTRACTOR"
          grep -Fq 'himipRadiusSq = beFloat(bytes, offset + 0x28)' "$EXTRACTOR"
          grep -Fq 'stream2ByteOffset = Int(Int32(bitPattern: be32(bytes, offset + 0x2C)))' "$EXTRACTOR"
          grep -Fq 'GFXWORLD:BE REAL' "$EXTRACTOR"

          echo 'Strict source-level GfxWorld validation passed.'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot iPhone Simulator and smoke-test app
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              for d in reversed(devices):
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          ')"

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          LAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" 2>&1)"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -Eq "$BUNDLE_ID: [0-9]+"

          sleep 10
          mkdir -p build/simulator-smoke
          xcrun simctl io "$DEVICE_UDID" screenshot build/simulator-smoke/launch.png

          # A second launch must still succeed. If the first launch crashed immediately,
          # simctl reports the failure here instead of silently shipping the IPA.
          RELAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" 2>&1)"
          echo "$RELAUNCH_OUTPUT"
          echo "$RELAUNCH_OUTPUT" | grep -Eq "$BUNDLE_ID: [0-9]+"

          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Upload Simulator smoke-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-simulator-smoke
          path: build/simulator-smoke/launch.png
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify compiled Tranzit decoder path
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$APP_PATH/ZombiesIOS"
          test -f "$EXECUTABLE"

          STRINGS_FILE="$(mktemp)"
          trap 'rm -f "$STRINGS_FILE"' EXIT
          strings "$EXECUTABLE" > "$STRINGS_FILE"

          if ! grep -Fq 'TRANZIT GFXWORLD DECODE' "$STRINGS_FILE"; then
            echo '::error::Compiled app does not contain the strict Tranzit GfxWorld path.'
            exit 1
          fi
          if grep -Fq 'Full-map geometry was not selected yet' "$STRINGS_FILE"; then
            echo '::error::Compiled app still contains the old temporary geometry fallback.'
            exit 1
          fi

          echo 'Compiled decoder verification passed.'

      - name: Audit built app for non-redistributable content
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          python3 Tools/content_audit.py "$APP_PATH" --allowlist Tools/content_allowlist.txt

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa \
              --target "$GITHUB_SHA" \
              --title "Latest ZombiesIOS IPA" \
              --notes "Unsigned iOS build that passed automated iPhone Simulator startup smoke testing and strict source-level PS3 GfxWorld validation. Sign before installing on iPhone."
          fi
