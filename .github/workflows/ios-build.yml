name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa \
              --target "$GITHUB_SHA" \
              --title "Latest ZombiesIOS IPA" \
              --notes "Automated unsigned iOS build. Sign before installing on iPhone."
          fi
