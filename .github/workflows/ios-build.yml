# Main remains manual/build-trigger only. The implementation branch runs CI on push.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tranzit-native-cache-impl
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
      - '.github/build-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate BO2 asset boundary and native cache sources
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print -quit | grep -q .; then
            echo "::error::Raw BO2/PS3 payload files must stay local and must not be bundled into the repository IPA."
            exit 1
          fi
          test -f Sources/ZombiesIOS/Cache/TranzitCacheManifest.swift
          test -f Sources/ZombiesIOS/Cache/TranzitMeshBinary.swift
          test -f Sources/ZombiesIOS/Import/T6AssetResolver.swift
          test -f Sources/ZombiesIOS/Import/T6WorldConverter.swift
          test -f Sources/ZombiesIOS/Import/T6MaterialConverter.swift
          test -f Sources/ZombiesIOS/Import/T6TextureConverter.swift
          test -f Sources/ZombiesIOS/Import/TranzitNativeImporter.swift
          test -f Sources/ZombiesIOS/Import/TranzitCacheValidator.swift
          test -f Sources/ZombiesIOS/Views/TranzitNativeGameplayView.swift
          test -f Sources/ZombiesIOS/Views/NativeFPSSceneView.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run native cache unit tests
        run: |
          xcodebuild test \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone 17 Pro simulator game
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch game on iPhone 17 Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          SIM_NAME='iPhone 17 Pro'
          BUNDLE_ID='com.r347h4ck3r.zombiesios'
          xcrun simctl boot "$SIM_NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIM_NAME" "$APP_PATH"
          xcrun simctl launch "$SIM_NAME" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$SIM_NAME" screenshot build/iPhone17Pro-game-smoke.png
          test -s build/iPhone17Pro-game-smoke.png

      - name: Upload simulator gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iPhone17Pro-game-smoke
          path: build/iPhone17Pro-game-smoke.png
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ZombiesIOS.xcodeproj \
            -scheme ZombiesIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify raw BO2 payloads are absent from app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          if find "$APP_PATH" -type f \( -name '*.ff' -o -name '*.ipak' -o -name '*.sabs' -o -name '*.sabl' -o -name 'EBOOT.BIN' \) -print -quit | grep -q .; then
            echo "::error::Raw BO2 payload leaked into the app bundle."
            exit 1
          fi

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZombiesIOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ZombiesIOS-unsigned.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombiesIOS-unsigned-IPA
          path: ZombiesIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or update latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build ZombiesIOS-unsigned.ipa --clobber
          else
            gh release create latest-build ZombiesIOS-unsigned.ipa \
              --target "$GITHUB_SHA" \
              --title "Latest ZombiesIOS IPA" \
              --notes "Unsigned iOS build with staged native Tranzit cache conversion. Sign before installing on iPhone."
          fi
