name: ZombiesIOS
options:
  bundleIdPrefix: com.r347h4ck3r

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0

targets:
  ZombiesIOS:
    type: application
    platform: iOS
    sources:
      - Sources/ZombiesIOS
    dependencies:
      - package: ZIPFoundation
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.zombiesios
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ZombiesIOS/Info.plist
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ZombiesIOS/Support/T6InflateBridge.h

  ZombiesIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ZombiesIOSTests
    dependencies:
      - target: ZombiesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.zombiesios.tests
